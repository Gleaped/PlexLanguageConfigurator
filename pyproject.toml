[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "plexlang"
version = "0.1.0"
description = "Bulk-assign audio and subtitle languages per series or movie for Plex Home users"
requires-python = ">=3.10"
dependencies = ["plexapi>=4.15,<5"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
plexlang = "plexlang.cli:main"

[tool.setuptools]
packages = ["plexlang"]
